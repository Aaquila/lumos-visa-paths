databases:
  - name: lumos-db
    plan: free
    databaseName: lumos
    user: lumos

services:
  # FastAPI backend — news scraper, case intake, user data.
  - type: web
    name: lumos-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: lumos-db
          property: connectionString
      # Frontend origin allowed to call this API. If Render assigns
      # lumos-web a different hostname than expected (name already
      # taken), update this to match after first deploy.
      - key: CORS_ORIGINS
        value: https://lumos-web.onrender.com
      # Demo-scale: scrape in-process at boot. For a longer-running
      # deployment, set this to 0 and point a Render Cron Job at
      # POST /api/news/refresh instead (see backend/README.md#scheduling).
      - key: SCRAPE_ON_STARTUP
        value: "1"
      - key: INTAKE_RATE_LIMIT
        value: "12"
      - key: LOG_LEVEL
        value: INFO
      # Secrets — set these in the Render dashboard after the blueprint syncs.
      #
      # GOOGLE_AUTH_CLIENT_ID here and GOOGLE_CLIENT_ID on lumos-web below must
      # be the SAME OAuth client. That client's Authorized JavaScript origins
      # (Google Cloud Console > APIs & Services > Credentials) must include
      # this live lumos-web URL, not just http://localhost:7357 from local
      # dev — docs/RUNNING.md only walks through the localhost origin.
      # Without the live origin added, every judge/visitor who clicks sign-in
      # gets a Google origin_mismatch error; the app does not degrade to demo
      # mode in that case, since the client ID itself is present and valid.
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTH_CLIENT_SECRET
        sync: false
      # Signs the Lumos session tokens issued by POST /api/auth/session. Render
      # generates one; without it the server falls back to a per-process random
      # secret and every deploy or restart signs everybody out.
      - key: LUMOS_SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

  # Flutter web build, served as a static site. Render has no native Dart
  # runtime, so the build command fetches the Flutter SDK itself.
  #
  # API_BASE_URL below is baked in at build time. "lumos-api" was already
  # taken by another Render app, so this backend actually deployed under
  # a suffixed name — check the lumos-api service page in the dashboard
  # for the real hostname if this ever needs updating again.
  - type: web
    name: lumos-web
    env: static
    rootDir: frontend
    buildCommand: >-
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter_sdk &&
      export PATH="$PATH:$(pwd)/_flutter_sdk/bin" &&
      flutter build web --release
      --dart-define=API_BASE_URL=https://lumos-api-23l3.onrender.com
      --dart-define=GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
    staticPublishPath: build/web
    envVars:
      # Same Google OAuth Web client ID as the backend's GOOGLE_AUTH_CLIENT_ID
      # above — see the note there on adding this service's live URL as an
      # Authorized JavaScript origin on that OAuth client before sharing the
      # link with judges/users.
      - key: GOOGLE_CLIENT_ID
        sync: false
    headers:
      # Google Identity Services signs in through a popup that posts its result
      # back to this window. Chrome's default isolation makes that postMessage
      # a console warning ("Cross-Origin-Opener-Policy policy would block the
      # window.postMessage call"); `same-origin-allow-popups` keeps the page
      # isolated from other origins while still letting our own popup talk back.
      #
      # Two neighbours this must NOT become:
      #   - `same-origin` severs the popup, which breaks sign-in outright.
      #   - Cross-Origin-Embedder-Policy blocks Google's button iframe, so it is
      #     deliberately absent — Flutter's wasm multi-threading wants it, but
      #     sign-in matters more here.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
    routes:
      # Flutter web is a client-routed SPA — unknown paths fall back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
