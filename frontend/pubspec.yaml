name: lumos
description: "Lumos — immigration compliance & pathway tracker (Flutter web frontend)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.0
  go_router: ^16.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/data/generic_pathways.json
    - assets/data/evidence_criteria_o1_eb1.json

  # Inter is bundled rather than fetched at runtime: the deployed web demo then
  # has no dependency on fonts.google.com, and renders identically offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
